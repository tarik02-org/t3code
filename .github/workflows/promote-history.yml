name: Promote history PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/promote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: pr
        name: Resolve promotion request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if [[ "$(jq -r .draft <<<"$pr_json")" != true ]]; then
            echo 'Promotion PR must remain a draft.' >&2
            exit 1
          fi
          if [[ "$(jq -r .base.ref <<<"$pr_json")" != main ]]; then
            echo 'Promotion PR must target main.' >&2
            exit 1
          fi
          if [[ "$(jq -r .head.repo.full_name <<<"$pr_json")" != "$GITHUB_REPOSITORY" ]]; then
            echo 'Promotion PR must come from this repository.' >&2
            exit 1
          fi
          labels="$(jq -r '[.labels[].name] | join(" ")' <<<"$pr_json")"
          kind=""
          if [[ " $labels " == *' actualization '* ]]; then kind=actualization; fi
          if [[ " $labels " == *' release '* ]]; then
            if [[ -n "$kind" ]]; then
              echo 'Promotion PR cannot have both actualization and release labels.' >&2
              exit 1
            fi
            kind=release
          fi
          if [[ -z "$kind" ]]; then
            echo 'Promotion PR needs an actualization or release label.' >&2
            exit 1
          fi
          {
            echo "number=$PR_NUMBER"
            echo "kind=$kind"
            echo "base_sha=$(jq -r .base.sha <<<"$pr_json")"
            echo "head_sha=$(jq -r .head.sha <<<"$pr_json")"
            echo "head_ref=$(jq -r .head.ref <<<"$pr_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout promotion head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Fetch upstream main
        run: git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main

      - name: Verify main has not moved
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$BASE_SHA" ]]; then
            echo "main moved from $BASE_SHA to $current_main; refresh the PR before promoting" >&2
            exit 1
          fi

      - name: Verify required PR checks
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          checks="$(gh pr checks "$PR_NUMBER" --json name,bucket)"
          if ! jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<<"$checks" >/dev/null; then
            echo 'All PR checks must be complete and successful before promotion.' >&2
            jq . <<<"$checks" >&2
            exit 1
          fi

      - name: Verify candidate history
        run: node scripts/validate-fork-history.ts --ref HEAD --upstream-ref refs/remotes/upstream/main

      - name: Verify validated main for release promotion
        if: steps.pr.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA/check-runs" --jq '[.check_runs[] | select(.name == "History / validate" and .conclusion == "success")] | length')"
          if [[ "$count" -eq 0 ]]; then
            echo 'Release promotion requires a validated main history.' >&2
            exit 1
          fi

      - id: push
        name: Promote without merging
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          KIND: ${{ steps.pr.outputs.kind }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GIT_COMMITTER_NAME: ${{ steps.app_token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          set -euo pipefail
          if [[ "$KIND" == actualization ]]; then
            promoted_sha="$HEAD_SHA"
          else
            parent="$(git rev-parse "$BASE_SHA^")"
            tree="$(git rev-parse "$HEAD_SHA^{tree}")"
            author="$(git show -s --format='%an <%ae>' "$HEAD_SHA")"
            message="$(git show -s --format=%B "$HEAD_SHA")"
            message+=$'\nRelease-PR: #'"$PR_NUMBER"$'\n'
            promoted_sha="$(printf '%s' "$message" | git commit-tree "$tree" -p "$parent" --author="$author")"
          fi
          git push --force-with-lease="refs/heads/main:$BASE_SHA" origin "$promoted_sha:refs/heads/main"
          echo "promoted_sha=$promoted_sha" >> "$GITHUB_OUTPUT"

      - name: Comment and close promotion PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          KIND: ${{ steps.pr.outputs.kind }}
          PROMOTED_SHA: ${{ steps.push.outputs.promoted_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "Promoted as $PROMOTED_SHA ($KIND). This PR was applied without a merge commit."
          gh pr close "$PR_NUMBER"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" >/dev/null || true
