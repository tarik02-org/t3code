name: Promote history PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/promote' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - id: pr
        name: Resolve promotion request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if [[ "$(jq -r .draft <<<"$pr_json")" != true ]]; then
            echo 'Promotion PR must remain a draft.' >&2
            exit 1
          fi
          if [[ "$(jq -r .head.repo.full_name <<<"$pr_json")" != "$GITHUB_REPOSITORY" ]]; then
            echo 'Promotion PR must come from this repository.' >&2
            exit 1
          fi
          labels="$(jq -r '[.labels[].name] | join(" ")' <<<"$pr_json")"
          kind=""
          if [[ " $labels " == *' actualization '* ]]; then kind=actualization; fi
          if [[ " $labels " == *' release '* ]]; then
            if [[ -n "$kind" ]]; then
              echo 'Promotion PR cannot have both actualization and release labels.' >&2
              exit 1
            fi
            kind=release
          fi
          if [[ -z "$kind" ]]; then
            echo 'Promotion PR needs an actualization or release label.' >&2
            exit 1
          fi
          base_ref="$(jq -r .base.ref <<<"$pr_json")"
          if [[ "$kind" == actualization ]]; then
            if [[ "$base_ref" != upstream/main ]]; then
              echo 'Actualization PR must target upstream/main.' >&2
              exit 1
            fi
            expected_main_sha="$(jq -r '.body // ""' <<<"$pr_json" | grep -oE '<!-- actualization-main-sha: [0-9a-f]{40} -->' | sed -E 's/.*: ([0-9a-f]{40}) -->/\1/' | head -n1 || true)"
            if [[ ! "$expected_main_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Actualization PR is missing its main history marker.' >&2
              exit 1
            fi
          else
            if [[ "$base_ref" != main ]]; then
              echo 'Release PR must target main.' >&2
              exit 1
            fi
            expected_main_sha="$(jq -r .base.sha <<<"$pr_json")"
          fi
          {
            echo "number=$PR_NUMBER"
            echo "kind=$kind"
            echo "base_sha=$(jq -r .base.sha <<<"$pr_json")"
            echo "base_ref=$base_ref"
            echo "expected_main_sha=$expected_main_sha"
            echo "head_sha=$(jq -r .head.sha <<<"$pr_json")"
            echo "head_ref=$(jq -r .head.ref <<<"$pr_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout promotion head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Fetch promotion base
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Verify main has not moved
        env:
          EXPECTED_MAIN_SHA: ${{ steps.pr.outputs.expected_main_sha }}
          KIND: ${{ steps.pr.outputs.kind }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "main moved from $EXPECTED_MAIN_SHA to $current_main; refresh the PR before promoting" >&2
            exit 1
          fi
          if [[ "$KIND" == actualization ]]; then
            current_upstream="$(git rev-parse refs/remotes/origin/upstream/main)"
            if [[ "$current_upstream" != "$BASE_SHA" ]]; then
              echo "upstream/main moved from $BASE_SHA to $current_upstream; refresh the PR before promoting" >&2
              exit 1
            fi
          fi

      - name: Verify required PR checks
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          checks="$(gh pr checks "$PR_NUMBER" --json name,workflow,bucket,startedAt)"
          latest_checks="$(
            jq '
              sort_by(.workflow, .name, .startedAt)
              | group_by([.workflow, .name])
              | map(max_by(.startedAt))
            ' <<<"$checks"
          )"
          if ! jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<<"$latest_checks" >/dev/null; then
            echo 'All PR checks must be complete and successful before promotion.' >&2
            jq . <<<"$latest_checks" >&2
            exit 1
          fi

      - name: Verify candidate history
        env:
        run: node scripts/validate-fork-history.ts --ref HEAD --upstream-ref "refs/remotes/origin/$BASE_REF"

      - name: Verify validated main for release promotion
        if: steps.pr.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA/check-runs" --jq '[.check_runs[] | select(.name == "History / validate" and .conclusion == "success")] | length')"
          if [[ "$count" -eq 0 ]]; then
            echo 'Release promotion requires a validated main history.' >&2
            exit 1
          fi

      - id: push
        name: Promote reviewed history
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.pr.outputs.expected_main_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          KIND: ${{ steps.pr.outputs.kind }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GIT_COMMITTER_NAME: ${{ steps.app_token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          set -euo pipefail
          if [[ "$KIND" == actualization ]]; then
            promoted_sha="$HEAD_SHA"
          else
            parent="$(git rev-parse "$BASE_SHA^")"
            tree="$(git rev-parse "$HEAD_SHA^{tree}")"
            author="$(git show -s --format='%an <%ae>' "$HEAD_SHA")"
            message="$(git show -s --format=%B "$HEAD_SHA")"
            message+=$'\nRelease-PR: #'"$PR_NUMBER"$'\n'
            promoted_sha="$(printf '%s' "$message" | git commit-tree "$tree" -p "$parent" --author="$author")"
          fi
          git push --force-with-lease="refs/heads/main:$EXPECTED_MAIN_SHA" origin "$promoted_sha:refs/heads/main"
          echo "promoted_sha=$promoted_sha" >> "$GITHUB_OUTPUT"

      - name: Finalize promotion PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          KIND: ${{ steps.pr.outputs.kind }}
          PROMOTED_SHA: ${{ steps.push.outputs.promoted_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "Promoted as $PROMOTED_SHA ($KIND)."
          pr_state="$(gh pr view "$PR_NUMBER" --json state --jq .state)"
          if [[ "$pr_state" == OPEN ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -f state=closed >/dev/null
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" >/dev/null || true
