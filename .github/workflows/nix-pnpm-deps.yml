name: Nix pnpm dependency hash

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nix-pnpm-dependency-hash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check PR pnpm dependency hash
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - id: update
        name: Calculate pnpm dependency hash fix
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if nix run github:Mic92/nix-update/cf68051e7b7e08de6c707484cdcd1a53feb48e05 -- \
              t3code-runtime \
              --flake \
              --version=skip \
              --override-filename nix/package.nix \
              --build; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

          if git diff --quiet -- nix/package.nix flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'The Nix pnpm dependency hash is stale.'
              echo
              echo '```diff'
              git diff -- nix/package.nix flake.lock
              echo '```'
            } | tee "$RUNNER_TEMP/nix-pnpm-dependency-hash.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post proposed hash change
        if: >-
          steps.update.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: nix-pnpm-dependency-hash
          path: ${{ runner.temp }}/nix-pnpm-dependency-hash.md

      - name: Remove resolved hash comment
        if: >-
          steps.update.outputs.changed == 'false' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: nix-pnpm-dependency-hash
          delete: true

      - name: Fail on dependency hash drift
        if: steps.update.outputs.changed == 'true'
        run: |
          echo '::error::The Nix pnpm dependency hash is stale. Apply the change from the job summary.'
          exit 1

  update:
    name: Check pnpm dependency hash
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - id: update
        name: Update pnpm dependency hash
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if nix run github:Mic92/nix-update/cf68051e7b7e08de6c707484cdcd1a53feb48e05 -- \
              t3code-runtime \
              --flake \
              --version=skip \
              --override-filename nix/package.nix \
              --build; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done

          git reset -- flake.lock
          git clean -f -- flake.lock

          if git diff --quiet -- nix/package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: pull_request
        name: Create or update dependency hash PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app_token.outputs.token }}
          base: ${{ github.ref_name }}
          branch: automation/nix-pnpm-dependency-hash-${{ github.ref_name }}
          delete-branch: true
          add-paths: nix/package.nix
          commit-message: update nix pnpm dependency hash
          title: update nix pnpm dependency hash
          body: |
            ## What Changed

            - Updated the Nix pnpm dependency hash for the current lockfile.

            ## Why

            The committed hash did not match the dependency store generated from `pnpm-lock.yaml`.

            ## Checklist

            - [x] This PR is small and focused
            - [x] I explained what changed and why

      - name: Fail on dependency hash drift
        if: steps.update.outputs.changed == 'true'
        env:
          PULL_REQUEST_URL: ${{ steps.pull_request.outputs.pull-request-url }}
        run: |
          echo "::error::The Nix pnpm dependency hash was stale. Repair PR: $PULL_REQUEST_URL"
          exit 1
