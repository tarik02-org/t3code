name: Stable Release PR

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Release Publish
    types:
      - completed
    branches:
      - main
  release:
    types:
      - published
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Events rejected by the state job must not cancel an active release PR update.
  group: stable-release-pr-${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success') || (github.event_name == 'release' && github.event.release.prerelease)) && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  state:
    name: Check stable release state
    if: >-
      (github.event_name != 'release' || github.event.release.prerelease == false) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prepare: ${{ steps.release_state.outputs.prepare }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - id: release_state
        name: Check for the current stable tag
        run: |
          package_version="$(node -p "require('./apps/server/package.json').version")"
          tag_sha="$(git rev-parse "refs/tags/v${package_version}^{commit}" 2>/dev/null || true)"
          if [[ -n "$tag_sha" ]]; then
            echo "prepare=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepare=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare stable release PR
    needs: state
    if: needs.state.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
              - --filter=@t3tools/oxlint-plugin-t3code...

      - name: Fetch tags and release branch
        run: |
          git fetch --force --tags origin
          git fetch origin release/stable || true

      - id: release_meta
        name: Resolve next stable version
        run: |
          node scripts/resolve-fork-stable-release.ts \
            --date "$(date -u +%Y%m%d)" \
            --github-output

      - id: update_versions
        name: Update package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.release_meta.outputs.version }}" --github-output

      - id: previous_tag
        name: Resolve previous stable release
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel stable \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      - name: Format package manifests
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - id: app_bot
        name: Resolve release bot identity
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        env:
          BRANCH_NAME: release/stable
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          git config user.name "${{ steps.app_bot.outputs.name }}"
          git config user.email "${{ steps.app_bot.outputs.email }}"
          git switch -C "$BRANCH_NAME"
          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            git commit --allow-empty -m "prepare stable release $RELEASE_VERSION"
          else
            git commit -m "prepare stable release $RELEASE_VERSION"
          fi
          git push --force-with-lease="refs/heads/$BRANCH_NAME" origin "HEAD:$BRANCH_NAME"

      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BRANCH_NAME: release/stable
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.previous_tag.outputs.previous_tag }}
        run: |
          title="prepare stable release $RELEASE_VERSION"
          body="$(mktemp)"
          commits="$(mktemp)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..origin/main" > "$commits"
          else
            echo "- No previous stable tag found." > "$commits"
          fi
          if [[ ! -s "$commits" ]]; then
            echo "- No commits found since the latest stable release." > "$commits"
          fi

          {
            echo "## Stable Release"
            echo
            echo "Merging this PR publishes $RELEASE_TAG."
            echo
            echo "Previous stable: ${PREVIOUS_TAG:-none}"
            echo
            echo "## Commits Since Previous Stable"
            cat "$commits"
          } > "$body"

          existing="$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq ".[0].number // empty")"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH_NAME" --title "$title" --body-file "$body"
          fi
