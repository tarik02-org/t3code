name: Prerelease Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "Prerelease channel"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - canary

permissions:
  contents: read
  id-token: write

concurrency:
  group: prerelease-build-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: Package prerelease
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'prepare stable release ')
    uses: ./.github/workflows/release-build.yml
    with:
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'nightly' }}
      release_ref: ${{ github.sha }}
